name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests
        run: cargo test --release
      - name: Kernel microbenchmark (smoke)
        run: cargo run --release -- bench-kernel

  cross-engine-parity:
    # Prove the Rust engine matches the Python engine on the same checkpoint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: pip install numpy
      - name: Clone the Python engine
        run: git clone --depth 1 https://github.com/EAnge1o/nimbus-infer.git ../nimbus-infer
      - name: Build
        run: cargo build --release
      - name: Parity (tokenizer + logits + greedy generation)
        run: python benchmarks/cross_engine.py parity
